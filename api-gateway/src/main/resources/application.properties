spring.application.name=api-gateway
server.port=8080
spring.main.web-application-type=reactive

# Remove duplicate CORS headers coming from downstream microservices
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

# ===== GATEWAY ROUTES (English - canonical) =====

spring.cloud.gateway.routes[0].id=usuarios-en
spring.cloud.gateway.routes[0].uri=http://localhost:8084
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/(?<segment>.*), /$\{segment}

spring.cloud.gateway.routes[1].id=reportes-en
spring.cloud.gateway.routes[1].uri=http://localhost:8083
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/reports/**,/api/mascotas/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/(?<segment>.*), /$\{segment}

spring.cloud.gateway.routes[2].id=geolocalizacion-en
spring.cloud.gateway.routes[2].uri=http://localhost:8081
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/map/**,/api/ubicaciones/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/(?<segment>.*), /$\{segment}

spring.cloud.gateway.routes[3].id=notificaciones-en
spring.cloud.gateway.routes[3].uri=http://localhost:8085
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/(?<segment>.*), /$\{segment}

# ===== GATEWAY ROUTES (Spanish aliases - for frontend) =====

spring.cloud.gateway.routes[4].id=usuarios-es
spring.cloud.gateway.routes[4].uri=http://localhost:8084
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/usuarios/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/api/usuarios/(?<segment>.*), /users/$\{segment}

spring.cloud.gateway.routes[5].id=reportes-es
spring.cloud.gateway.routes[5].uri=http://localhost:8083
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/reportes,/api/reportes/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/api/reportes(?<segment>/.*|), /reports$\{segment}

spring.cloud.gateway.routes[6].id=notificaciones-es
spring.cloud.gateway.routes[6].uri=http://localhost:8085
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/notificaciones,/api/notificaciones/**
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/api/notificaciones(?<segment>/.*|), /notifications$\{segment}

spring.cloud.gateway.routes[7].id=hotzones-es
spring.cloud.gateway.routes[7].uri=http://localhost:8081
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/geolocalizacion/hotzones,/api/geolocalizacion/hotzones/**
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/api/geolocalizacion/hotzones(?<segment>/.*|), /hotzones$\{segment}

spring.cloud.gateway.routes[8].id=geolocalizacion-es
spring.cloud.gateway.routes[8].uri=http://localhost:8081
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/geolocalizacion,/api/geolocalizacion/**
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/api/geolocalizacion(?<segment>/.*|), /map$\{segment}

spring.cloud.gateway.routes[9].id=proyectos
spring.cloud.gateway.routes[9].uri=http://localhost:8086
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/proyectos,/api/proyectos/**
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/api/(?<segment>.*), /$\{segment}

spring.cloud.gateway.routes[10].id=recursos-humanos
spring.cloud.gateway.routes[10].uri=http://localhost:8087
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/rh/**,/api/empleados/**,/api/departamentos/**,/api/permisos/**
spring.cloud.gateway.routes[10].filters[0]=RewritePath=/api/(?<segment>.*), /$\{segment}

# ===== CORS =====
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# ===== SECURITY =====
jwt.secret=SanosYSalvos2024SecretKeyForJWTTokenGeneration
jwt.expiration=86400000
