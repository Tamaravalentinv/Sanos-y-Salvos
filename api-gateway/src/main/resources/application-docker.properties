# Docker profile - overrides localhost URLs with Docker service names

spring.cloud.gateway.routes[0].id=usuarios-en
spring.cloud.gateway.routes[0].uri=http://ms-usuarios:8084
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/(?<segment>.*), /$\{segment}

spring.cloud.gateway.routes[1].id=reportes-en
spring.cloud.gateway.routes[1].uri=http://ms-reportes:8083
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/reports/**,/api/mascotas/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/(?<segment>.*), /$\{segment}

spring.cloud.gateway.routes[2].id=geolocalizacion-en
spring.cloud.gateway.routes[2].uri=http://ms-geolocalizacion:8081
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/map/**,/api/ubicaciones/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/(?<segment>.*), /$\{segment}

spring.cloud.gateway.routes[3].id=notificaciones-en
spring.cloud.gateway.routes[3].uri=http://ms-notificaciones:8085
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/(?<segment>.*), /$\{segment}

spring.cloud.gateway.routes[4].id=usuarios-es
spring.cloud.gateway.routes[4].uri=http://ms-usuarios:8084
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/usuarios/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/api/usuarios/(?<segment>.*), /users/$\{segment}

spring.cloud.gateway.routes[5].id=reportes-es
spring.cloud.gateway.routes[5].uri=http://ms-reportes:8083
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/reportes,/api/reportes/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/api/reportes/?(?<segment>.*), /reports/$\{segment}

spring.cloud.gateway.routes[6].id=notificaciones-es
spring.cloud.gateway.routes[6].uri=http://ms-notificaciones:8085
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/notificaciones,/api/notificaciones/**
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/api/notificaciones/?(?<segment>.*), /notifications/$\{segment}

spring.cloud.gateway.routes[7].id=geolocalizacion-es
spring.cloud.gateway.routes[7].uri=http://ms-geolocalizacion:8081
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/geolocalizacion,/api/geolocalizacion/**
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/api/geolocalizacion/?(?<segment>.*), /map/$\{segment}
